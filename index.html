/* api(): batas waktu 60 dtk (unggah 180 dtk); aksi BACA diulang 1x bila jaringan putus atau sistem sibuk. Aksi tulis tidak pernah diulang otomatis. senyap = tanpa bilah loading. */
/* Pencarian beruntun: hanya jawaban permintaan TERAKHIR yang dipakai, sehingga jawaban lama yang datang terlambat tidak menimpa hasil terbaru. */
const SEQ_BACA = {}, TERBARU = new Set(['listPM', 'listTugas', 'listAudit', 'listDataTambahan', 'listUsers']);
async function api(action, params, labelKhusus, senyap) {
  params = params || {};
  const mySeq = TERBARU.has(action) && !params.semua ? (SEQ_BACA[action] = (SEQ_BACA[action] || 0) + 1) : 0;
  const label = senyap ? '' : (labelKhusus || (action === 'listPM' && params.semua ? 'Menyiapkan laporan...' : AKSI_LABEL[action]));
  const baca = /^(get|list|foto)/.test(action) && !params.semua, batas = action === 'uploadBerkas' ? 180000 : 60000, ridAwal = RID_ROUTE;
  if (!senyap) { nSibuk++; if (label) labelAktif.push(label); sibukUI(); }
  try {
    for (let n = 0; ; n++) {
      let j;
      try {
        const ac = new AbortController(), tm = setTimeout(() => ac.abort(), batas);
        try { const r = await fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token, action, params }), signal: ac.signal }); j = await r.json(); }
        finally { clearTimeout(tm); }
      } catch (e) {
        if (baca && n < 1) { await new Promise(r => setTimeout(r, 1200)); continue; }
        throw new Error(e && e.name === 'AbortError' ? 'Server terlalu lama menjawab. Periksa sambungan internet lalu coba lagi.' : 'Tidak dapat terhubung ke server. Periksa sambungan internet lalu coba lagi.');
      }
      if (!j.ok) {
        if (/TOKEN|BELUM_LOGIN/.test(j.error)) { logout('Sesi berakhir, silakan masuk lagi.'); throw new Error('Sesi berakhir'); }
        if (baca && n < 1 && /SISTEM_SIBUK/.test(j.error)) { await new Promise(r => setTimeout(r, 2500)); continue; }
        throw new Error(errMsg(j.error));
      }
      // Bacaan untuk halaman yang sudah ditinggalkan dibuang agar tidak menimpa halaman yang sedang dibuka.
      if (baca && !senyap && ridAwal !== RID_ROUTE) throw new Error(BATAL_RUTE);
      if (mySeq && SEQ_BACA[action] !== mySeq) throw new Error(BATAL_RUTE);
      return j.data;
    }
  } finally { if (!senyap) { nSibuk--; if (label) labelAktif.splice(labelAktif.lastIndexOf(label), 1); sibukUI(); } }
}

      const r = await api('addDataTambahan', { id_pm: id, kategori: q('#kat').value, kategori_baru: q('#katb').value, tingkat_akses: q('#lvl').value, judul: q('#jud').value, isi: q('#isi').value, lampiran_url: q('#lamp').value });
      const f = q('#lampf').files[0]; let gagal = '';
      if (f) { try { await kirimBerkas(id, 'lampiran', f, r.id_data); } catch (x) { gagal = x.message; } }
      m.remove(); if (baru) REF = null;
      toast(gagal ? 'Catatan tersimpan, tetapi lampiran gagal: ' + gagal : 'Tersimpan', !!gagal);
      vDetail(id, 'Data Tambahan').catch(x => toast(x.message, 1));
    } catch (x) { toast(x.message, 1); e.target.disabled = false; }
  };
}

/* ========= Status orang tua (yatim / piatu) ========= */
const ORTU = ['Orang tua lengkap', 'Yatim', 'Piatu', 'Yatim Piatu', 'Orang tua cerai', 'Ayah sambung', 'Ibu sambung'];
const ORTU_KET = { 'Orang tua lengkap': 'Orang tua lengkap', 'Yatim': 'Yatim (ayah meninggal dunia)', 'Piatu': 'Piatu (ibu meninggal dunia)', 'Yatim Piatu': 'Yatim piatu (ayah dan ibu meninggal dunia)', 'Orang tua cerai': 'Orang tua cerai', 'Ayah sambung': 'Ayah sambung (ibu menikah lagi)', 'Ibu sambung': 'Ibu sambung (ayah menikah lagi)' };
const ortuBadge = s => (s && s !== 'Orang tua lengkap' && ORTU_KET[s]) ? `<span class="b ort" title="${esc(ORTU_KET[s])}">${esc(s)}</span>` : '';
const ortuSel = (id, cur, kosong) => `<option value="">${kosong || '-'}</option>` + ORTU.map(x => `<option value="${esc(x)}"${x === cur ? ' selected' : ''}>${esc(ORTU_KET[x])}</option>`).join('');

/* ========= Atur posisi foto (geser, perbesar, putar) sebelum diunggah ========= */
/* Hasil: berkas JPEG 3:4 (600 x 800 px) persis sesuai bingkai, sehingga foto pas di profil, daftar, dan cetakan. */
function potongFoto(file) {
  return new Promise((selesai, tolak) => {
    if (!/^image\/(jpeg|png)$/.test(file.type)) { tolak(new Error('Foto harus berupa gambar JPG atau PNG.')); return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); tolak(new Error('Gambar tidak dapat dibaca.')); };
    img.onload = () => {
      const FW = 252, FH = 336, OW = 600, OH = 800;
      let rot = 0, zoom = 1, tx = 0, ty = 0, selesaiSudah = false;
      const m = modal(`<h2>Atur foto</h2><p class="mut" style="margin:0">Geser foto agar wajah berada di tengah bingkai. Perbesar dengan penggeser, tombol +/-, roda mouse, atau cubit dua jari.</p>
        <div class="crop-wrap"><div class="crop-frame" style="width:${FW}px;height:${FH}px"><canvas id="cv" width="${FW * 2}" height="${FH * 2}" style="width:${FW}px;height:${FH}px" tabindex="0" aria-label="Area foto. Geser untuk memposisikan, panah di keyboard menggeser, plus dan minus memperbesar."></canvas><div class="crop-guide" aria-hidden="true"></div></div></div>
        <div class="crop-ctl"><button type="button" class="chip" id="zm" aria-label="Perkecil">&minus;</button><input type="range" id="zr" min="100" max="400" value="100" aria-label="Perbesar foto"><button type="button" class="chip" id="zp" aria-label="Perbesar">+</button></div>
        <div class="crop-ctl"><button type="button" class="chip" id="rt">Putar 90&deg;</button><button type="button" class="chip" id="rs">Atur ulang</button></div>
        <small id="cinfo" role="status"></small>
        <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="bt">Batal</button><button type="button" class="btn" id="ok">Simpan dan unggah</button></div>`);
      m.querySelector('.card').style.maxWidth = '420px';
      const cv = m.querySelector('#cv'), cx = cv.getContext('2d'), zr = m.querySelector('#zr'), info = m.querySelector('#cinfo');
      const dim = () => (rot % 180 ? [img.height, img.width] : [img.width, img.height]);
      const skala = () => { const [iw, ih] = dim(); return Math.max(FW / iw, FH / ih) * zoom; };
      const batasi = () => { const [iw, ih] = dim(), s = skala(), mx = Math.max(0, (iw * s - FW) / 2), my = Math.max(0, (ih * s - FH) / 2); tx = Math.min(mx, Math.max(-mx, tx)); ty = Math.min(my, Math.max(-my, ty)); };
      const gambar = (c, k) => { c.imageSmoothingQuality = 'high'; c.fillStyle = '#fff'; c.fillRect(0, 0, FW * k, FH * k); c.save(); c.translate(FW * k / 2 + tx * k, FH * k / 2 + ty * k); c.rotate(rot * Math.PI / 180); const s = skala() * k; c.scale(s, s); c.drawImage(img, -img.width / 2, -img.height / 2); c.restore(); };
      const render = () => { batasi(); gambar(cx, 2); zr.value = String(Math.round(zoom * 100)); const px = FW / skala(); info.textContent = px < OW * 0.7 ? 'Resolusi foto asli rendah untuk bingkai ini; hasil bisa kurang tajam. Perkecil atau pakai foto yang lebih besar.' : 'Resolusi cukup tajam.'; };
      const ubahZoom = z => { zoom = Math.min(4, Math.max(1, z)); render(); };
      render();
      const ptr = new Map(); let jarak = 0;
      cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]); if (ptr.size === 2) { const [a, b] = [...ptr.values()]; jarak = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
      cv.addEventListener('pointermove', e => {
        if (!ptr.has(e.pointerId)) return; const lama = ptr.get(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]);
        if (ptr.size === 1) { tx += e.clientX - lama[0]; ty += e.clientY - lama[1]; render(); }
        else if (ptr.size === 2) { const [a, b] = [...ptr.values()], j = Math.hypot(a[0] - b[0], a[1] - b[1]); if (jarak) ubahZoom(zoom * j / jarak); jarak = j; }
      });
      const lepas = e => { ptr.delete(e.pointerId); jarak = 0; };
      cv.addEventListener('pointerup', lepas); cv.addEventListener('pointercancel', lepas);
      cv.addEventListener('wheel', e => { e.preventDefault(); ubahZoom(zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); }, { passive: false });
      cv.addEventListener('keydown', e => {
        const d = { ArrowLeft: [-10, 0], ArrowRight: [10, 0], ArrowUp: [0, -10], ArrowDown: [0, 10] }[e.key];
        if (d) { e.preventDefault(); tx += d[0]; ty += d[1]; render(); } else if (e.key === '+' || e.key === '=') { e.preventDefault(); ubahZoom(zoom * 1.1); } else if (e.key === '-') { e.preventDefault(); ubahZoom(zoom / 1.1); }
      });
      zr.oninput = () => ubahZoom(Number(zr.value) / 100);
      m.querySelector('#zp').onclick = () => ubahZoom(zoom * 1.15); m.querySelector('#zm').onclick = () => ubahZoom(zoom / 1.15);
      m.querySelector('#rt').onclick = () => { rot = (rot + 90) % 360; tx = 0; ty = 0; render(); };
      m.querySelector('#rs').onclick = () => { rot = 0; zoom = 1; tx = 0; ty = 0; render(); };
      const tutup = hasil => { if (selesaiSudah) return; selesaiSudah = true; URL.revokeObjectURL(url); m.remove(); selesai(hasil); };

function modal(html) {
  const m = document.createElement('div'), asal = document.activeElement; m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" tabindex="-1">${html}</div>`;
  m.onclick = e => { if (e.target === m) m.remove(); };
  /* Esc menutup, Tab berputar di dalam dialog, fokus kembali ke tombol pemicu saat ditutup. */
  m.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.stopPropagation(); m.remove(); return; }
    if (e.key !== 'Tab') return;
    const f = [...m.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled])')].filter(x => x.offsetParent !== null);
    if (!f.length) return; const a = f[0], z = f[f.length - 1];
    if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
  });
  new MutationObserver((_, ob) => { if (!document.body.contains(m)) { ob.disconnect(); try { if (asal && asal.focus && document.body.contains(asal)) asal.focus(); } catch (e) { /* abaikan */ } } }).observe(document.body, { childList: true });
  document.body.appendChild(m);
  const fx = m.querySelector('input:not([type=hidden]),select,textarea,button'); (fx || m.firstChild).focus();
  return m;
}
/* Dialog konfirmasi (pengganti confirm() bawaan browser). Mengembalikan Promise<boolean>; Esc atau klik di luar = batal. Fokus awal di tombol Batal. */
function konfirmasi(judul, teks, labelOk, bahaya) {
  return new Promise(res => {
    const m = modal(`<h2>${esc(judul)}</h2><p>${esc(teks).replace(/\n/g, '<br>')}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="kb">Batal</button><button class="btn${bahaya ? ' dgr' : ''}" id="ko">${esc(labelOk || 'Ya, lanjutkan')}</button></div>`);
    let selesai = false; const akhir = v => { if (selesai) return; selesai = true; ob.disconnect(); m.remove(); res(v); };
    const ob = new MutationObserver(() => { if (!document.body.contains(m)) akhir(false); }); ob.observe(document.body, { childList: true });
    m.querySelector('#kb').onclick = () => akhir(false); m.querySelector('#ko').onclick = () => akhir(true);
  });
}

const MAKS_DOK = 10 * 1024 * 1024, MAKS_FOTO = 1.5 * 1024 * 1024;
const ACC_DOK = '.jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf';
function keBase64(buf) { let s = ''; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
/** Gambar diperkecil dan dikodekan ulang sebagai JPEG (membuang metadata seperti lokasi GPS). PDF dikirim apa adanya. */
async function prepFile(file, jenis) {
  const ext = (String(file.name || '').split('.').pop() || '').toLowerCase();
  const word = false; /* Word tidak diterima lagi; gunakan PDF */
  if (!word && !/^(image\/(jpeg|png)|application\/pdf)$/.test(file.type)) throw new Error('Hanya JPG, PNG, atau PDF yang diterima. Simpan dokumen Word sebagai PDF terlebih dahulu.');
  if (jenis === 'foto' && (word || file.type === 'application/pdf')) throw new Error('Foto harus berupa gambar JPG atau PNG.');
  if (word || file.type === 'application/pdf') {
    if (file.size > MAKS_DOK) throw new Error('Ukuran berkas maksimal 10 MB.');
    return { mime: file.type, data: keBase64(await file.arrayBuffer()) };
  }
  const url = URL.createObjectURL(file);
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Gambar tidak dapat dibaca.')); i.src = url; });
  const mx = jenis === 'foto' ? 800 : 1800, sc = Math.min(1, mx / Math.max(img.width, img.height)), cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(img.width * sc)); cv.height = Math.max(1, Math.round(img.height * sc));
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
  const data = cv.toDataURL('image/jpeg', 0.82).split(',')[1];
  if (data.length * 0.75 > (jenis === 'foto' ? MAKS_FOTO : MAKS_DOK)) throw new Error('Gambar masih terlalu besar setelah diperkecil.');
  return { mime: 'image/jpeg', data };
}
async function kirimBerkas(idPm, jenis, file, idData, tingkat) {
  const f = file.dipotong ? { mime: 'image/jpeg', data: keBase64(await file.arrayBuffer()) } : await prepFile(file, jenis);
  return api('uploadBerkas', { id_pm: idPm, jenis, id_data: idData || '', tingkat_akses: tingkat || 'Umum', mime: f.mime, data: f.data });
}
async function viewBerkas(id) {
  const r = await api('getBerkas', { id_berkas: id }, 'Membuka berkas...');
  const url = URL.createObjectURL(new Blob([Uint8Array.from(atob(r.data), c => c.charCodeAt(0))], { type: r.mime }));
  const isi = r.mime === 'application/pdf' ? `<iframe src="${url}" title="Pratinjau berkas" style="width:100%;height:70vh;border:0;border-radius:12px"></iframe>`
    : /^image\//.test(r.mime) ? `<img src="${url}" alt="Pratinjau berkas" style="max-width:100%;max-height:70vh;border-radius:12px;align-self:center">`
    : '<div class="lock">Pratinjau berkas Word tidak tersedia di browser. Klik <b>Unduh</b> untuk membukanya di Microsoft Word atau aplikasi lain.</div>';
  const m = modal(`<div class="row sp"><b>${esc(r.nama_file)}</b><div class="row"><a class="chip" href="${url}" download="${esc(r.nama_file)}" style="text-decoration:none">Unduh</a><button class="chip" id="tt">Tutup</button></div></div>${isi}`);
  m.querySelector('.card').style.maxWidth = '920px';
  m.querySelector('#tt').onclick = () => m.remove();
  new MutationObserver((_, ob) => { if (!document.body.contains(m)) { ob.disconnect(); setTimeout(() => URL.revokeObjectURL(url), 1000); } }).observe(document.body, { childList: true });
}

/* Mengisi ulang pilihan asrama pada <select>. form=true: pilihan pertama '-' (kosong); selain itu pilihan tetap milik filter. */
function isiAsrama(sel, list, cur, form) {
  if (!sel) return;
  const awal = form ? [] : [...sel.options].slice(0, 2).map(o => o.outerHTML);
  sel.innerHTML = (form ? '<option value="">-</option>' : awal.join('')) + list.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join('');
  sel.value = (form ? ['', ...list] : ['', '__kosong', ...list]).indexOf(cur) >= 0 ? cur : '';
}

const LAP_JENIS = [['rekap', 'Rekapitulasi Penerima Manfaat'], ['mutasi', 'Mutasi Penerima Manfaat'], ['bpjs_desil', 'Status BPJS/KIS dan Desil'], ['pelatihan', 'Pelatihan Keterampilan'], ['dokumen', 'Kelengkapan Dokumen'], ['hasil_program', 'Hasil Program dan Alumni']];

  if (LP.tipe === 'bulan') { const [yy, mm] = (LP.bulan || bulanIni()).split('-').map(Number); return { dari: `${yy}-${p2(mm)}-01`, sampai: `${yy}-${p2(mm)}-${p2(akhirBulan(yy, mm))}`, label: `Bulan ${BLN[mm - 1]} ${yy}` }; }

/* Blok tanda tangan: kiri "Mengetahui" (Kepala UPT), kanan pembuat laporan. Bila pembuat sama dengan yang mengetahui, hanya satu kolom. */

const tabelLap = (kolom, rows, nTeks, total) => `<table class="tbf lap"><thead><tr>${kolom.map((k, i) => `<th${i >= nTeks ? ' class="n"' : ''}>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((v, i) => `<td${i >= nTeks ? ' class="n"' : ''}>${esc(v)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${kolom.length}">Tidak ada data.</td></tr>`}${total ? `<tr class="tot">${total.map((v, i) => `<td${i >= nTeks ? ' class="n"' : ''}>${esc(v)}</td>`).join('')}</tr>` : ''}</tbody></table>`;

function susunLaporan(d) {

/* ---------- Seret-dan-lepas berkas ke semua kotak unggah ---------- */
(function seretLepas() {
  const punyaBerkas = e => e.dataTransfer && [...(e.dataTransfer.types || [])].indexOf('Files') >= 0;
  const cari = e => {
    const modalAtas = [...document.querySelectorAll('.modal')].pop(), lingkup = modalAtas || document.getElementById('view') || document.body;
    let el = e.target instanceof Element ? e.target : null;
    if (!el || !lingkup.contains(el)) { if (modalAtas) el = null; }
    while (el && el !== document.body) {
      const ins = [...el.querySelectorAll('input[type=file]')].filter(i => !i.disabled);
      if (ins.length === 1) return { input: ins[0], area: el };
      if (ins.length > 1) return null; // beberapa kotak unggah di area ini: pengguna harus menjatuhkan tepat di barisnya
      if (el === lingkup) break;
      el = el.parentElement;
    }
    const semua = [...lingkup.querySelectorAll('input[type=file]')].filter(i => !i.disabled);
    return semua.length === 1 ? { input: semua[0], area: semua[0].closest('label,.row,.card') || lingkup } : null;
  };
  let tandai = null; const bersih = () => { if (tandai) { tandai.classList.remove('dz-on'); tandai = null; } };
  document.addEventListener('dragover', e => { if (!punyaBerkas(e)) return; e.preventDefault(); const t = cari(e); if (t) { e.dataTransfer.dropEffect = 'copy'; if (tandai !== t.area) { bersih(); tandai = t.area; tandai.classList.add('dz-on'); } } else { e.dataTransfer.dropEffect = 'none'; bersih(); } });
  document.addEventListener('dragleave', e => { if (!e.relatedTarget) bersih(); });
  const cocok = (f, acc) => { if (!acc) return true; return acc.split(',').map(s => s.trim().toLowerCase()).filter(Boolean).some(a => a.charAt(0) === '.' ? f.name.toLowerCase().endsWith(a) : a.endsWith('/*') ? f.type.toLowerCase().indexOf(a.slice(0, -1)) === 0 : f.type.toLowerCase() === a); };
  document.addEventListener('drop', e => {
    if (!punyaBerkas(e)) return; e.preventDefault(); bersih();
    const t = cari(e);
    if (!t) { toast('Buka dulu kotak unggah, lalu seret berkas tepat ke barisnya.', 1); return; }
    let fl = [...e.dataTransfer.files]; if (!t.input.multiple) fl = fl.slice(0, 1);
    const ok = fl.filter(f => cocok(f, t.input.accept));
    if (!ok.length) { toast('Jenis berkas tidak sesuai untuk kotak ini.', 1); return; }
    try { const dt = new DataTransfer(); ok.forEach(f => dt.items.add(f)); t.input.files = dt.files; t.input.dispatchEvent(new Event('change', { bubbles: true })); } catch (x) { toast('Browser ini belum mendukung seret berkas. Gunakan tombol unggah.', 1); }
  });
})();

/* ---------- PWA: pasang ke layar utama, pembaruan, penanda offline ---------- */
let PWA_EVT = null;
const sudahTerpasang = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
const perangkatIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA_EVT = e; const b = document.getElementById('pwaBox'); if (b) { b.innerHTML = pwaKotak(); pwaPasang(); } });
window.addEventListener('appinstalled', () => { PWA_EVT = null; toast('Aplikasi terpasang di perangkat Anda'); const b = document.getElementById('pwaBox'); if (b) b.innerHTML = pwaKotak(); });
function pwaKotak() {
  if (sudahTerpasang()) return '<div class="note ok">Aplikasi sudah terpasang dan sedang dibuka dari layar utama.</div>';
  if (PWA_EVT) return '<p class="mut" style="margin:0">Pasang DataPM di layar utama agar terbuka seperti aplikasi biasa, tanpa bilah alamat browser.</p><button class="btn" id="pwaBtn" style="width:fit-content">Pasang aplikasi</button>';
  if (perangkatIOS()) return '<p class="mut" style="margin:0">Di iPhone/iPad: buka halaman ini di <b>Safari</b>, ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas), lalu pilih <b>Tambah ke Layar Utama</b>.</p>';
  return '<p class="mut" style="margin:0">Buka menu browser (titik tiga) lalu pilih <b>Pasang aplikasi</b> atau <b>Tambahkan ke layar utama</b>. Bila pilihan itu tidak ada, buka halaman ini di Chrome atau Edge lewat alamat https.</p>';
}
function pwaPasang() {
  const b = document.getElementById('pwaBtn'); if (!b || !PWA_EVT) return;
  b.onclick = async () => { try { PWA_EVT.prompt(); await PWA_EVT.userChoice; } catch (x) { /* abaikan */ } PWA_EVT = null; const k = document.getElementById('pwaBox'); if (k) k.innerHTML = pwaKotak(); };
}
function tampilBarOffline() {
  let b = document.getElementById('offBar');
  if (navigator.onLine) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('div'); b.id = 'offBar'; b.className = 'off-bar'; b.setAttribute('role', 'status'); b.textContent = 'Tidak ada sambungan internet. Data tidak dapat dimuat atau disimpan.'; document.body.appendChild(b); }
}
window.addEventListener('online', () => { tampilBarOffline(); toast('Sambungan internet kembali'); });
window.addEventListener('offline', tampilBarOffline);
function barPembaruan(sw) {
  if (document.getElementById('pwaUpd')) return;
  const b = document.createElement('div'); b.id = 'pwaUpd'; b.className = 'pwa-bar'; b.setAttribute('role', 'status');
  b.innerHTML = '<span>Versi baru aplikasi tersedia.</span><button class="btn" id="pwaMuat">Muat ulang</button>';
  document.body.appendChild(b);
  document.getElementById('pwaMuat').onclick = () => { sw.postMessage('SKIP_WAITING'); };
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) barPembaruan(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) barPembaruan(w); }); });
      setInterval(() => { try { reg.update(); } catch (x) { /* abaikan */ } }, 3600000);
    }).catch(() => { /* PWA opsional: aplikasi tetap jalan tanpa service worker */ });
    let muat = false; const adaKontrol = !!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener('controllerchange', () => { if (muat || !adaKontrol) return; muat = true; location.reload(); });
  });
}
tampilBarOffline();
terapkanTema();
if (token) boot(); else showLogin();
